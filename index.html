<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mustafa's Shop</title>
    <meta name="description" content="Stock, khata, bills and profit for Mustafa's Shop — snacks, stationery, photocopy &amp; printing" />
    <meta name="theme-color" content="#0E7490" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Mustafa's Shop" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Only register a Service Worker for real browser/PWA installs.
      // Inside the Capacitor Android app, "window.Capacitor" exists and
      // files are already served from the APK itself — a Workbox/PWA
      // Service Worker on top of that can intercept and break those loads,
      // which is a common cause of a blank white screen after install.
      if ("serviceWorker" in navigator && !window.Capacitor) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
